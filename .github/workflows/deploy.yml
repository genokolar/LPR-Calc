name: Deploy to GitHub Pages

# 触发条件
on:
  # push到main分支时触发
  push:
    branches: ['main', 'master']
    # 只在这些文件变更时触发
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - '.github/workflows/deploy.yml'
  
  # 定时触发：每月20日(及21-24日)自动检查更新LPR数据并部署
  # 因为LPR通常在每月20日公布（遇节假日顺延），所以多设几天确保捕获
  schedule:
    - cron: '0 10 20-24 * *'
  
  # 允许手动触发
  workflow_dispatch:

# 权限设置
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 从中国货币网抓取最新LPR数据
      - name: Fetch latest LPR data
        run: |
          echo "Fetching latest LPR from chinamoney.com.cn..."
          # 尝试获取最新LPR数据
          RESPONSE=$(curl -sL --max-time 15 \
            'https://www.chinamoney.com.cn/r/cms/www/chinamoney/data/currency/bk-lpr.json' || echo "")

          if [ -n "$RESPONSE" ] && echo "$RESPONSE" | grep -q '"records"'; then
            # 解析JSON获取日期和利率
            DATE=$(echo "$RESPONSE" | grep -oP '"showDateCN":"\K[0-9]{4}-[0-9]{2}-[0-9]{2}' | head -1)
            LPR_1Y=$(echo "$RESPONSE" | grep -oP '"termCode":"1Y".*?"shibor":"\K[0-9.]+' | head -1)
            LPR_5Y=$(echo "$RESPONSE" | grep -oP '"termCode":"5Y".*?"shibor":"\K[0-9.]+' | head -1)

            if [ -n "$DATE" ] && [ -n "$LPR_1Y" ] && [ -n "$LPR_5Y" ]; then
              echo "Fetched LPR data: $DATE - 1Y: $LPR_1Y%, 5Y: $LPR_5Y%"
              # 使用 Node.js 写入JSON（避免shell引号问题）
              node -e "
                const fs = require('fs');
                const data = {
                  date: process.argv[1],
                  oneYear: parseFloat(process.argv[2]),
                  fiveYear: parseFloat(process.argv[3]),
                  source: 'chinamoney.com.cn',
                  fetchedAt: new Date().toISOString().replace(/\\.\\d{3}Z$/, 'Z')
                };
                fs.writeFileSync('public/lpr-latest.json', JSON.stringify(data, null, 2));
                console.log('Updated public/lpr-latest.json');
              " "$DATE" "$LPR_1Y" "$LPR_5Y"
            else
              echo "Failed to parse LPR data, keeping existing file"
            fi
          else
            echo "Failed to fetch from chinamoney.com.cn, keeping existing file"
          fi

          # 显示最终文件内容
          echo "--- public/lpr-latest.json ---"
          cat public/lpr-latest.json || echo "File does not exist"

      # 4. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 5. 构建项目
      - name: Build
        run: npm run build

      # 6. 配置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 7. 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传 dist 目录
          path: './dist'

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
