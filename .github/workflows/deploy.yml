name: Deploy to GitHub Pages

# 触发条件
on:
  # push到main分支时触发
  push:
    branches: ['main', 'master']
    # 只在这些文件变更时触发
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  
  # 定时触发：每月20日(及21-24日)自动检查更新LPR数据并部署
  # 因为LPR通常在每月20日公布（遇节假日顺延），所以多设几天确保捕获
  schedule:
    - cron: '0 10 20-24 * *'
  
  # 允许手动触发
  workflow_dispatch:

# 权限设置
permissions:
  contents: write      # 需要写权限把更新后的LPR数据提交回仓库
  pages: write
  id-token: write

# 并发控制
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 构建任务
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 设置 Node.js 环境
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. 从中国货币网抓取最近一年全部LPR历史数据，与内置数据合并
      #    生成 public/lpr-history.json（完整历史）+ public/lpr-latest.json（最新一期）
      #    失败时自动保留仓库中已有的 public 数据文件，不影响构建
      - name: Fetch LPR history data
        run: |
          for i in 1 2 3; do
            echo "=== Attempt $i ==="
            node scripts/fetch-lpr.mjs && break
            echo "Retry in 20 seconds..."
            sleep 20
          done
          echo "--- public/lpr-latest.json ---"
          cat public/lpr-latest.json || echo "File does not exist"
          echo "--- public/lpr-history.json (meta) ---"
          head -c 300 public/lpr-history.json || echo "File does not exist"

      # 3.5 把更新后的LPR数据提交回仓库，作为下次抓取的起点
      #     [skip ci] 防止本次提交再次触发构建形成循环
      - name: Commit updated LPR data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/lpr-history.json public/lpr-latest.json
          if git diff --cached --quiet; then
            echo "No LPR data changes to commit"
          else
            git commit -m "chore: update LPR data [skip ci]"
            git push
            echo "Committed updated LPR data"
          fi

      # 4. 安装依赖
      - name: Install dependencies
        run: npm ci

      # 5. 构建项目
      - name: Build
        run: npm run build

      # 6. 配置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 7. 上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 上传 dist 目录
          path: './dist'

  # 部署任务
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      # 部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
